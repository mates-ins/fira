<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enigma: La casella misteriosa</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: white;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.5em, 5vw, 3em);
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        p {
            margin-top: 10px;
            margin-bottom: 30px;
            font-size: clamp(1em, 3vw, 1.5em);
            color: #bdc3c7;
            font-weight: 300;
            text-align: center;
        }

        .controls {
            margin-bottom: 25px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            background-color: #e74c3c;
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s, background-color 0.2s;
            font-weight: bold;
            font-family: inherit;
        }

        button:hover {
            background-color: #c0392b;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(1px);
        }

        /* La Graella 6x6 */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: min(8px, 1.5vw);
            background-color: #34495e;
            padding: min(15px, 3vw);
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            width: fit-content;
        }

        .cell {
            width: min(70px, 13vw);
            height: min(70px, 13vw);
            background-color: #ecf0f1;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            
            display: flex;
            align-items: center;
            justify-content: center;
            
            font-size: min(24px, 4vw);
            font-weight: bold;
            color: #2c3e50;
            user-select: none;
            border: none;
            font-family: inherit;
        }

        .cell:hover {
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .cell:focus-visible {
            outline: 3px solid #f1c40f;
            outline-offset: 2px;
        }

        /* Estil quan la casella és NEGRA */
        .cell.is-black {
            background-color: #2c3e50;
            border: 2px solid #1a252f;
            color: #ecf0f1;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        /* ====== RESPONSIVE ====== */
        @media (max-width: 400px) {
            body { padding: 10px; }
            .controls button {
                padding: 10px 18px;
                font-size: 14px;
            }
        }

    </style>
</head>
<body>

    <h1>Enigma</h1>
    <p>La casella misteriosa</p>

    <div class="controls">
        <button onclick="generarParitatPerfecta()" aria-label="Generar nova graella">GENERAR NOVA GRAELLA</button>
    </div>

    <div class="grid" id="board" role="grid" aria-label="Graella 6x6 de caselles">
    </div>

    <script>
        const board = document.getElementById('board');
        const size = 6;
        
        // Matriu de dades per calcular la lògica (0 = blanc, 1 = negre)
        let gridData = [];

        function generarParitatPerfecta() {
            // 1. Netejar dades
            gridData = Array(size).fill().map(() => Array(size).fill(0));
            board.innerHTML = '';

            // 2. Omplir aleatòriament el quadrat 5x5 (files 0-4, cols 0-4)
            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 5; c++) {
                    gridData[r][c] = Math.random() < 0.5 ? 0 : 1;
                }
            }

            // 3. Calcular la 6a COLUMNA (Paritat de fila)
            for (let r = 0; r < 5; r++) {
                let rowSum = 0;
                for (let c = 0; c < 5; c++) rowSum += gridData[r][c];
                gridData[r][5] = (rowSum % 2 === 0) ? 0 : 1;
            }

            // 4. Calcular la 6a FILA (Paritat de columna)
            for (let c = 0; c < 6; c++) {
                let colSum = 0;
                for (let r = 0; r < 5; r++) colSum += gridData[r][c];
                gridData[5][c] = (colSum % 2 === 0) ? 0 : 1;
            }

            // 5. Dibuixar la graella al HTML
            dibuixarGraella();
        }

        function dibuixarGraella() {
            let comptador = 1;

            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    const cell = document.createElement('button');
                    cell.classList.add('cell');
                    
                    cell.textContent = comptador;
                    cell.setAttribute('aria-label', `Casella ${comptador}, ${gridData[r][c] === 1 ? 'negra' : 'blanca'}`);
                    comptador++;

                    if (gridData[r][c] === 1) {
                        cell.classList.add('is-black');
                    }

                    // EVENT CLICK: toggle blanc/negre
                    cell.addEventListener('click', function() {
                        this.classList.toggle('is-black');
                    });

                    board.appendChild(cell);
                }
            }
        }

        // Generar una graella només obrir la pàgina
        generarParitatPerfecta();

    </script>

</body>
</html>
