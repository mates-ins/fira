<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enigma: els bidons</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50; /* Fons fosc coherent amb l'altre enigma */
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            margin: 0;
            font-size: 2.5em;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        p {
            color: #bdc3c7;
            font-size: 1.2em;
            margin-bottom: 40px;
        }

        .game-area {
            display: flex;
            gap: 50px;
            align-items: flex-end;
            margin-bottom: 40px;
        }

        /* ESTIL DE LA bidó */
        .jug-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .jug {
            border: 4px solid #ecf0f1;
            border-top: none; /* Obert per dalt */
            border-radius: 0 0 15px 15px;
            position: relative;
            background-color: rgba(255, 255, 255, 0.1);
            overflow: hidden;
            width: 120px;
            transition: all 0.3s;
        }

        /* Alçada visual proporcional a la capacitat */
        #jug5 { height: 250px; } /* 50px per litre */
        #jug3 { height: 150px; }

        /* L'AIGUA */
        .water {
            background-color: #3498db; /* Blau aigua */
            width: 100%;
            position: absolute;
            bottom: 0;
            height: 0%; /* Canvia amb JS */
            transition: height 0.5s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            font-weight: bold;
            color: rgba(255,255,255,0.8);
        }

        /* MARQUES DE LITRES (Opcional, visual) */
        .lines {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .line {
            border-bottom: 1px dashed rgba(255,255,255,0.3);
            width: 100%;
            position: absolute;
        }

        .info {
            font-size: 1.5em;
            font-weight: bold;
        }

        /* BOTONS DE CONTROL */
        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }

        .btn-fill { background-color: #2ecc71; color: white; } /* Verd */
        .btn-empty { background-color: #e74c3c; color: white; } /* Vermell */
        .btn-transfer { background-color: #f39c12; color: white; font-size: 1.2em;} /* Taronja */

        /* ZONA DE TRANSFERÈNCIA (Fletxes) */
        .transfer-area {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
            height: 200px; /* Alineat amb el mig de les gerres */
        }

        /* MISSATGE DE VICTÒRIA */
        #victory-message {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            border: 4px solid #f1c40f;
            z-index: 10;
        }
        #victory-message h2 { color: #f1c40f; font-size: 3em; margin: 0;}
        #victory-message p { color: white; font-size: 1.5em; }
        
        .reset-all {
            margin-top: 30px;
            background-color: #95a5a6;
            color: white;
            padding: 10px 30px;
            font-size: 1.2em;
        }

    </style>
</head>
<body>

    <h1>Enigma</h1>
    <p>Objectiu: Aconseguir exactament <strong>4 LITRES</strong> a la bidó gran.</p>

    <div class="game-area">
        
        <div class="jug-container">
            <div class="info">5 litres</div>
            <div class="jug" id="jug5">
                <div class="lines">
                    <div class="line" style="bottom: 20%"></div>
                    <div class="line" style="bottom: 40%"></div>
                    <div class="line" style="bottom: 60%"></div>
                    <div class="line" style="bottom: 80%"></div>
                </div>
                <div class="water" id="water5">0L</div>
            </div>
            <div class="controls">
                <button class="btn-fill" onclick="fillJug(5)">Omplir</button>
                <button class="btn-empty" onclick="emptyJug(5)">Buidar</button>
            </div>
        </div>

        <div class="transfer-area">
            <button class="btn-transfer" onclick="transfer(5, 3)" title="Passar de gran a petit">gran &#8594; petit</button>
            <button class="btn-transfer" onclick="transfer(3, 5)" title="Passar de petit a gran">petit &#8594; gran</button>
        </div>

        <div class="jug-container">
            <div class="info">3 litres</div>
            <div class="jug" id="jug3">
                <div class="lines">
                    <div class="line" style="bottom: 33.3%"></div>
                    <div class="line" style="bottom: 66.6%"></div>
                </div>
                <div class="water" id="water3">0L</div>
            </div>
            <div class="controls">
                <button class="btn-fill" onclick="fillJug(3)">Omplir</button>
                <button class="btn-empty" onclick="emptyJug(3)">Buidar</button>
            </div>
        </div>

    </div>

    <button class="reset-all" onclick="resetGame()">Reiniciar Tot</button>

    <div id="victory-message">
        <h2>🎉 MOLT BÉ! 🎉</h2>
        <p>Has aconseguit l'objectiu de tenir 4 litres!</p>
        <button class="btn-fill" onclick="resetGame()">Tornar a jugar</button>
    </div>

    <script>
        // ESTAT DEL JOC
        let jugs = {
            5: { current: 0, max: 5, element: document.getElementById('water5') },
            3: { current: 0, max: 3, element: document.getElementById('water3') }
        };

        // ACTUALITZAR VISTA (Visuals)
        function updateView() {
            for (let size in jugs) {
                let jug = jugs[size];
                // Alçada en percentatge
                let percent = (jug.current / jug.max) * 100;
                jug.element.style.height = percent + '%';
                
                // Text interior (si està buit no mostrem 0L per estètica, o sí)
                jug.element.textContent = jug.current > 0 ? jug.current + 'L' : '';
            }
            checkWin();
        }

        // ACCIÓ: OMPLIR
        function fillJug(size) {
            jugs[size].current = jugs[size].max;
            updateView();
        }

        // ACCIÓ: BUIDAR
        function emptyJug(size) {
            jugs[size].current = 0;
            updateView();
        }

        // ACCIÓ: TRANSFERIR (La lògica matemàtica)
        function transfer(fromSize, toSize) {
            let fromJug = jugs[fromSize];
            let toJug = jugs[toSize];

            // Quant hi cap a la destinació?
            let spaceAvailable = toJug.max - toJug.current;
            
            // Quanta aigua movem? (El mínim entre la que tenim i la que hi cap)
            let amountToMove = Math.min(fromJug.current, spaceAvailable);

            // Executem el moviment
            fromJug.current -= amountToMove;
            toJug.current += amountToMove;

            updateView();
        }

        // REINICIAR
        function resetGame() {
            jugs[5].current = 0;
            jugs[3].current = 0;
            document.getElementById('victory-message').style.display = 'none';
            updateView();
        }

        // COMPROVAR VICTÒRIA
        function checkWin() {
            // L'enigma demana 4 litres (normalment a la gran)
            if (jugs[5].current === 4) {
                // Petit retard perquè l'animació acabi abans del missatge
                setTimeout(() => {
                    document.getElementById('victory-message').style.display = 'block';
                }, 500);
            }
        }

        // INICIAR
        updateView();

    </script>

</body>
</html>
